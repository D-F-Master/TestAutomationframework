[pytest]
addopts = -vs --alluredir=temps --clean-alluredir 

;开启allure报告


log_file = ./log/test.log
log_file_level = info
;log_file_format = %(asctime)s %(filename)s [函数:%(funcName)s] [line:%(lineno)d] %(levelname)s --%(message)s
log_file_format = %(asctime)s %(filename)s %(levelname)s --   %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

log_cli = True
log_cli_level = info
;log_cli_format = %(asctime)s %(filename)s [函数:%(funcName)s] [line:%(lineno)d] %(levelname)s --%(message)s
log_cli_format = %(asctime)s %(levelname)s --   %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
